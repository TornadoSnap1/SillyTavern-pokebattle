<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poké-Switch v8.0 (Doubles & Dynamax Edition)</title>
<link rel="stylesheet" href="battle-utilities.css">
<style>
    
    body { background: #f0f2f5; margin: 0; padding: 20px; font-family: 'Roboto Mono', monospace; overflow: hidden; user-select: none; }
    .allow-select { user-select: text !important; -webkit-user-select: text !important; }

    /* 纹理 */
    .plastic-texture { background-color: #ff3c28; background-image: radial-gradient(circle at 10% 10%, rgba(255,255,255,0.2) 0%, transparent 20%); box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), inset 5px 5px 15px rgba(255,255,255,0.1), 5px 10px 20px rgba(0,0,0,0.4); }
    .plastic-texture-r { background-color: #0ab9e6; background-image: radial-gradient(circle at 90% 10%, rgba(255,255,255,0.2) 0%, transparent 20%); box-shadow: inset 5px -5px 15px rgba(0,0,0,0.2), inset -5px 5px 15px rgba(255,255,255,0.1), 5px 10px 20px rgba(0,0,0,0.4); }
    .paper-pattern { background-image: repeating-linear-gradient(white 0px, white 24px, #e5e7eb 25px); background-color: #fff; }
    .custom-scrollbar { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #d1d5db #f3f4f6; }

    /* 动画集 */
    @keyframes shake { 0% { transform: translate(0, 0); } 25% { transform: translate(-5px, 0); } 75% { transform: translate(5px, 0); } 100% { transform: translate(0, 0); } }
    .shake-anim { animation: shake 0.3s ease-in-out; }
    
    @keyframes flash-red { 0% { filter: none; } 50% { filter: sepia(1) hue-rotate(-50deg) saturate(3); } 100% { filter: none; } }
    .flash-anim { animation: flash-red 0.3s ease-in-out; }
    
    @keyframes tera-shine { 
        0% { filter: brightness(1); } 
        50% { filter: brightness(1.3) hue-rotate(15deg) drop-shadow(0 0 10px cyan); transform: scale(1.05); } 
        100% { filter: brightness(1.1) drop-shadow(0 0 5px cyan); } 
    }
    .tera-anim { animation: tera-shine 1.5s ease-out forwards; border: 2px solid cyan; border-radius: 50%; }

    /* 极巨化专属动效 (Dynamax) */
    @keyframes dynamax-glow {
        0% { transform: scale(1.35); filter: drop-shadow(0 -5px 15px rgba(230, 20, 60, 0.9)) drop-shadow(0 0 25px rgba(160, 0, 40, 0.7)); }
        50% { transform: scale(1.4); filter: drop-shadow(0 -8px 25px rgba(255, 40, 80, 1)) drop-shadow(0 0 35px rgba(200, 0, 60, 0.9)); }
        100% { transform: scale(1.35); filter: drop-shadow(0 -5px 15px rgba(230, 20, 60, 0.9)) drop-shadow(0 0 25px rgba(160, 0, 40, 0.7)); }
    }
    .dynamax-anim { animation: dynamax-glow 2s infinite ease-in-out; transform-origin: bottom center; z-index: 30 !important; }

    @keyframes faint-down {
        0% { transform: translateY(0); opacity: 1; filter: grayscale(0); }
        100% { transform: translateY(20px); opacity: 0; filter: grayscale(1); }
    }
    .faint-anim { animation: faint-down 1.5s ease-in forwards; }
    @keyframes buff-anim { 0% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.1); filter: brightness(1.3); } 100% { transform: scale(1); } }
    .buff-effect { animation: buff-anim 0.5s ease-out; }

    /* 图标与颜色 */
    .ball-icon { width: 9px; height: 9px; border-radius: 50%; border: 1px solid #333; background: linear-gradient(to bottom, #f00 50%, #fff 50%); position: relative; box-shadow: 1px 1px 1px rgba(0,0,0,0.3); }
    .ball-icon.fainted { filter: grayscale(100%) brightness(0.6); opacity: 0.5; background: #555; }
    .status-badge { font-size: 8px; padding: 1px 3px; border-radius: 3px; color: white; margin-right: 2px; }
    .status-psn { background: #a040a0; } .status-tox { background: #a040a0; border: 1px solid #fff; }
    .status-par { background: #f8d030; color: #444; } .status-slp { background: #8c888c; }
    .status-brn { background: #f08030; } .status-frz { background: #98d8d8; color: #444; }

    .bg-type-Normal { background-color: #A8A77A; color: #fff; } .bg-type-Fire { background-color: #EE8130; color: #fff; } .bg-type-Water { background-color: #6390F0; color: #fff; } .bg-type-Electric { background-color: #F7D02C; color: #444; } .bg-type-Grass { background-color: #7AC74C; color: #fff; } .bg-type-Ice { background-color: #96D9D6; color: #444; } .bg-type-Fighting { background-color: #C22E28; color: #fff; } .bg-type-Poison { background-color: #A33EA1; color: #fff; } .bg-type-Ground { background-color: #E2BF65; color: #fff; } .bg-type-Flying { background-color: #A98FF3; color: #fff; } .bg-type-Psychic { background-color: #F95587; color: #fff; } .bg-type-Bug { background-color: #A6B91A; color: #fff; } .bg-type-Rock { background-color: #B6A136; color: #fff; } .bg-type-Ghost { background-color: #735797; color: #fff; } .bg-type-Dragon { background-color: #6F35FC; color: #fff; } .bg-type-Dark { background-color: #705746; color: #fff; } .bg-type-Steel { background-color: #B7B7CE; color: #444; } .bg-type-Fairy { background-color: #D685AD; color: #fff; }

    .hidden { display: none !important; }
</style>
<link rel="stylesheet" href="battle-ui.css">
</head>
<body>

<!-- Setup Modal (配置与调试) -->
<div id="setup-modal" class="fixed inset-0 bg-gray-900/90 z-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white p-6 rounded-xl shadow-2xl w-[780px] border-4 border-blue-500 max-h-[92vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-xl font-bold text-gray-800">🎮 Poké-Switch 对战控制台 (含双打 & 极巨化)</h2>
            <button onclick="document.getElementById('setup-modal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 text-lg">✕</button>
        </div>

        <!-- 快速测试预设栏 -->
        <div class="bg-blue-50 p-3 rounded-lg border border-blue-200 mb-4">
            <div class="text-xs font-bold text-blue-800 mb-2">⚡ 一键快速测试预设 (点击填入配置，再点击“启动战斗”)：</div>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="window.applyPreset('singles_mega')" class="p-2 bg-white hover:bg-blue-100 border border-blue-300 rounded text-left flex items-center gap-1.5 transition">
                    <span>🟢</span> <div><b class="text-blue-900">单打: Mega & 太晶化测试</b><div class="text-[10px] text-gray-500">沙奈朵(Mega) vs 水箭龟(Mega)</div></div>
                </button>
                <button onclick="window.applyPreset('singles_dynamax')" class="p-2 bg-white hover:bg-red-100 border border-red-300 rounded text-left flex items-center gap-1.5 transition">
                    <span>🔴</span> <div><b class="text-red-900">单打: 极巨化对抗测试</b><div class="text-[10px] text-gray-500">皮卡丘(极巨化) vs 喷火龙(极巨化)</div></div>
                </button>
                <button onclick="window.applyPreset('doubles_classic')" class="p-2 bg-white hover:bg-purple-100 border border-purple-300 rounded text-left flex items-center gap-1.5 transition">
                    <span>🔵</span> <div><b class="text-purple-900">双打: 2v2 经典双打测试</b><div class="text-[10px] text-gray-500">盖欧卡+闪电鸟 vs 固拉多+席多蓝恩</div></div>
                </button>
                <button onclick="window.applyPreset('doubles_dynamax')" class="p-2 bg-white hover:bg-amber-100 border border-amber-300 rounded text-left flex items-center gap-1.5 transition">
                    <span>💥</span> <div><b class="text-amber-900">双打: 极巨化 2v2 对战测试</b><div class="text-[10px] text-gray-500">卡比兽+班基拉斯 vs 拉普拉斯+铝钢龙</div></div>
                </button>
            </div>
        </div>

        <!-- 模式与世代选择 -->
        <div class="grid grid-cols-2 gap-3 mb-4 bg-gray-50 p-2.5 rounded border border-gray-200 text-xs">
            <div class="flex items-center gap-2">
                <span class="font-bold text-gray-700">对战模式:</span>
                <label class="flex items-center gap-1 cursor-pointer">
                    <input type="radio" name="battle_mode" value="singles" checked id="mode-singles"> 单打 (1v1)
                </label>
                <label class="flex items-center gap-1 cursor-pointer">
                    <input type="radio" name="battle_mode" value="doubles" id="mode-doubles"> 双打 (2v2)
                </label>
            </div>
            <div class="flex items-center gap-2">
                <span class="font-bold text-gray-700">规则世代:</span>
                <label class="flex items-center gap-1 cursor-pointer">
                    <input type="radio" name="battle_gen" value="gen9" checked id="gen-gen9"> Gen 9 (朱紫/太晶/Mega)
                </label>
                <label class="flex items-center gap-1 cursor-pointer">
                    <input type="radio" name="battle_gen" value="gen8" id="gen-gen8"> Gen 8 (剑盾/极巨化/Mega)
                </label>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-xs font-bold mb-1 text-blue-600">我方队伍 (Player)</label>
                <textarea id="p1-team-input" class="w-full h-40 p-2 text-xs border-2 border-gray-300 rounded font-mono bg-gray-50 focus:border-blue-500 outline-none resize-none allow-select" placeholder="粘贴 Showdown 格式队伍...">
Gardevoir @ Gardevoirite
Ability: Trace
Level: 50
- Hyper Voice
- Psyshock
- Moonblast
- Mystical Fire

Pikachu @ Light Ball
Ability: Lightning Rod
Level: 50
- Thunderbolt
- Volt Tackle
- Quick Attack
- Iron Tail
                </textarea>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 text-red-600">敌方队伍 (Opponent)</label>
                <textarea id="p2-team-input" class="w-full h-40 p-2 text-xs border-2 border-gray-300 rounded font-mono bg-gray-50 focus:border-red-500 outline-none resize-none allow-select" placeholder="粘贴 Showdown 格式队伍...">
Blastoise @ Blastoisinite
Ability: Torrent
Level: 50
- Water Pulse
- Aura Sphere
- Dark Pulse
- Ice Beam

Charizard
Ability: Blaze
Level: 50
- Flamethrower
- Air Slash
- Dragon Pulse
- Solar Beam
                </textarea>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="window.debugTeamParser()" class="bg-gray-500 hover:bg-gray-400 text-white font-bold py-3 px-5 rounded-lg shadow text-xs">🔍 仅检查格式</button>
            <button onclick="window.initBattle()" class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3 rounded-lg shadow transform transition hover:scale-[1.01] active:scale-95 text-base">🚀 启动战斗</button>
        </div>
        <div id="debug-output" class="mt-2 text-[10px] text-red-500 font-mono h-10 overflow-y-auto hidden"></div>
    </div>
</div>

<section class="battle-hud" aria-label="战斗控制">
  <div class="hud-top"><strong>POKÉ-SWITCH · 对战终端</strong>
    <div class="hud-tools"><label>演出速度 <select aria-label="演出速度" onchange="window.setBattleSpeed(this.value)"><option value="1">标准</option><option value="2">快速 ×2</option><option value="instant">即时</option></select></label><button onclick="window.skipBattleAnimation()">跳过本段</button><button id="battle-sound" aria-pressed="false" onclick="window.toggleBattleSound()">音效：关</button><button id="log-toggle" aria-expanded="true" onclick="document.body.classList.toggle('logs-collapsed'); this.setAttribute('aria-expanded', !document.body.classList.contains('logs-collapsed'))">战斗日志</button></div>
  </div><div id="action-status" role="status" aria-live="polite">请配置队伍并开始战斗</div>
</section>
<div id="app-scaler" class="w-full flex flex-col items-center transition-transform duration-200 origin-top mt-2" style="transform: scale(1.0);">
    
    <div id="field-overview" class="field-overview" aria-label="当前场地效果"></div>
    <!-- 顶部状态栏：同时兼容单打与双打 (支持 A/B 两个槽位) -->
    <div class="status-row w-[600px] flex justify-between items-end px-4 z-10 -mb-2">
        <!-- P1 区域 -->
        <div class="flex flex-col items-start w-1/2 pr-1">
            <div id="p1-balls" class="flex gap-1 mb-1 pl-1"></div>
            
            <!-- P1A 状态卡片 -->
            <div id="p1a-card" class="bg-gray-800 text-white px-2.5 py-1.5 rounded-t-lg rounded-br-lg border-l-4 border-blue-500 shadow-md w-full max-w-[240px] flex flex-col justify-between mb-1">
                <div>
                    <div class="flex justify-between items-baseline gap-1 mb-0.5">
                        <div class="flex items-baseline gap-1 min-w-0 flex-1">
                            <span id="p1a-name" class="font-bold text-xs truncate block">P1-A</span>
                            <span id="p1a-level" class="text-[9px] text-yellow-400 font-mono font-bold flex-shrink-0">Lv.--</span>
                        </div>
                        <div id="p1a-types" class="flex flex-shrink-0 text-sm ml-1"></div>
                    </div>
                    <div id="p1a-stats" class="flex flex-wrap gap-1 text-[8px] mb-0.5 min-h-[12px]"></div>
                </div>
                <div>
                    <div class="flex justify-between items-center px-0.5 mb-0.5">
                        <span id="p1a-ability" class="text-[8px] text-purple-300 font-bold italic truncate max-w-[100px]">-</span>
                        <span id="p1a-gimmick-badge" class="text-[8px] font-bold text-cyan-300"></span>
                    </div>
                    <div class="w-full h-2 bg-gray-700 rounded-full overflow-hidden border border-gray-600">
                        <div id="p1a-hp-bar" class="h-full bg-green-500 transition-all duration-500" style="width: 100%"></div>
                    </div>
                    <div class="flex justify-between items-center mt-0.5">
                        <button type="button" id="p1a-item" class="held-item">携带：载入中</button>
                        <span id="p1a-hp-text" class="text-[8px] font-mono text-gray-300">--/--</span>
                    </div>
                </div>
            </div>

            <!-- P1B 状态卡片 (双打时显示) -->
            <div id="p1b-card" class="hidden bg-gray-800/90 text-white px-2.5 py-1 rounded-br-lg border-l-4 border-cyan-500 shadow-md w-full max-w-[240px] flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-baseline gap-1">
                        <div class="flex items-baseline gap-1 min-w-0 flex-1">
                            <span id="p1b-name" class="font-bold text-[11px] truncate block text-cyan-200">P1-B</span>
                            <span id="p1b-level" class="text-[8px] text-yellow-400 font-mono font-bold flex-shrink-0">Lv.--</span>
                        </div>
                        <div id="p1b-types" class="flex flex-shrink-0 text-xs ml-1"></div>
                    </div>
                    <div id="p1b-stats" class="flex flex-wrap gap-1 text-[8px]"></div>
                </div>
                <div>
                    <div class="flex justify-between items-center px-0.5">
                        <span id="p1b-ability" class="text-[8px] text-purple-300 italic truncate max-w-[90px]">-</span>
                        <span id="p1b-gimmick-badge" class="text-[8px] font-bold text-cyan-300"></span>
                    </div>
                    <div class="w-full h-1.5 bg-gray-700 rounded-full overflow-hidden border border-gray-600">
                        <div id="p1b-hp-bar" class="h-full bg-green-500 transition-all duration-500" style="width: 100%"></div>
                    </div>
                    <div class="flex justify-between items-center mt-0.5 text-[8px] font-mono text-gray-300">
                        <button type="button" id="p1b-item" class="held-item">携带：载入中</button>
                        <span id="p1b-hp-text">--/--</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- P2 区域 -->
        <div class="flex flex-col items-end w-1/2 pl-1">
            <div id="p2-balls" class="flex gap-1 mb-1 pr-1"></div>

            <!-- P2A 状态卡片 -->
            <div id="p2a-card" class="bg-gray-800 text-white px-2.5 py-1.5 rounded-t-lg rounded-bl-lg border-r-4 border-red-500 shadow-md w-full max-w-[240px] flex flex-col justify-between mb-1">
                <div>
                    <div class="flex justify-between items-baseline gap-1 mb-0.5">
                        <div id="p2a-types" class="flex flex-shrink-0 text-sm mr-1"></div>
                        <div class="flex items-baseline gap-1 min-w-0 flex-1 justify-end">
                            <span id="p2a-level" class="text-[9px] text-yellow-400 font-mono font-bold flex-shrink-0">Lv.--</span>
                            <span id="p2a-name" class="font-bold text-xs truncate block">P2-A</span>
                        </div>
                    </div>
                    <div id="p2a-stats" class="flex flex-wrap gap-1 text-[8px] mb-0.5 justify-end min-h-[12px]"></div>
                </div>
                <div>
                    <div class="flex justify-between items-center px-0.5 mb-0.5">
                        <span id="p2a-gimmick-badge" class="text-[8px] font-bold text-red-300"></span>
                        <span id="p2a-ability" class="text-[8px] text-purple-300 font-bold italic truncate max-w-[100px] ml-auto">-</span>
                    </div>
                    <div class="w-full h-2 bg-gray-700 rounded-full overflow-hidden border border-gray-600">
                        <div id="p2a-hp-bar" class="h-full bg-green-500 transition-all duration-500" style="width: 100%"></div>
                    </div>
                    <div class="item-hp-row"><button type="button" id="p2a-item" class="held-item">携带：未公开</button><span id="p2a-hp-text">--/--</span></div>
                </div>
            </div>

            <!-- P2B 状态卡片 (双打时显示) -->
            <div id="p2b-card" class="hidden bg-gray-800/90 text-white px-2.5 py-1 rounded-bl-lg border-r-4 border-amber-500 shadow-md w-full max-w-[240px] flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-baseline gap-1">
                        <div id="p2b-types" class="flex flex-shrink-0 text-xs mr-1"></div>
                        <div class="flex items-baseline gap-1 min-w-0 flex-1 justify-end">
                            <span id="p2b-level" class="text-[8px] text-yellow-400 font-mono font-bold flex-shrink-0">Lv.--</span>
                            <span id="p2b-name" class="font-bold text-[11px] truncate block text-amber-200">P2-B</span>
                        </div>
                    </div>
                    <div id="p2b-stats" class="flex flex-wrap gap-1 text-[8px] justify-end"></div>
                </div>
                <div>
                    <div class="flex justify-between items-center px-0.5">
                        <span id="p2b-gimmick-badge" class="text-[8px] font-bold text-red-300"></span>
                        <span id="p2b-ability" class="text-[8px] text-purple-300 italic truncate max-w-[90px] ml-auto">-</span>
                    </div>
                    <div class="w-full h-1.5 bg-gray-700 rounded-full overflow-hidden border border-gray-600">
                        <div id="p2b-hp-bar" class="h-full bg-green-500 transition-all duration-500" style="width: 100%"></div>
                    </div>
                    <div class="item-hp-row"><button type="button" id="p2b-item" class="held-item">携带：未公开</button><span id="p2b-hp-text">--/--</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 屏幕与 Switch 手柄 -->
    <div class="console-body flex items-start justify-center z-20">
        <!-- 左 Joy-Con -->
        <div class="w-24 plastic-texture rounded-l-[40px] shadow-inner border-r border-black/20 h-[360px] p-4 flex flex-col items-center">
            <div class="text-[9px] font-bold text-white mb-2 opacity-80 border-b border-white/30 w-full text-center pb-1">场地</div>
            <button type="button" id="field-weather" class="text-2xl text-white text-center mb-4 min-h-[30px] filter drop-shadow-md" hidden></button>
            <button type="button" id="field-terrain" class="text-xl text-white text-center mb-4 min-h-[25px] filter drop-shadow-md" hidden></button>
            <div class="text-[9px] font-bold text-white mb-2 opacity-80 border-b border-white/30 w-full text-center pb-1">我方场地</div>
            <div id="p1-side-conditions" class="text-[8px] text-white text-center flex flex-col gap-1"></div>
        </div>

        <!-- 中间 Switch 屏幕 -->
        <div id="screen-frame" class="relative w-[600px] bg-white shadow-2xl z-20 overflow-hidden border-y-[14px] border-x-[8px] border-black rounded-sm ring-1 ring-gray-800 transition-all duration-300 h-[320px]">
            <!-- 战斗背景 -->
            <div id="scene-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-500" style="background-image: url('https://play.pokemonshowdown.com/fx/bg-beach.jpg');"></div>
            
            <!-- 右上角快捷测试重载按钮 -->
            <button onclick="document.getElementById('setup-modal').classList.remove('hidden')" class="absolute top-2 left-2 z-30 bg-black/50 hover:bg-black/70 text-white text-[10px] px-2 py-1 rounded backdrop-blur-sm border border-white/20 transition">
                ⚙️ 调试与预设
            </button>

            <!-- 战斗舞台精灵立绘 (支持单打与双打 4 槽位) -->
            <div id="battle-sprites" class="absolute inset-0 pointer-events-none">
                <!-- 敌方 A 位 (右上主位) -->
                <div class="absolute top-10 right-24 flex flex-col items-center z-10">
                    <img id="p2a-img" alt="宝可梦" src="" class="w-28 h-28 object-contain drop-shadow-lg opacity-0 transition-all duration-500">
                </div>
                <!-- 敌方 B 位 (双打时右侧靠前/偏中) -->
                <div id="p2b-wrapper" class="hidden absolute top-4 right-8 flex flex-col items-center z-10">
                    <img id="p2b-img" alt="宝可梦" src="" class="w-24 h-24 object-contain drop-shadow-lg opacity-0 transition-all duration-500">
                </div>

                <!-- 我方 A 位 (左下主位) -->
                <div class="absolute bottom-4 left-14 flex flex-col items-center z-20">
                    <img id="p1a-img" alt="宝可梦" src="" class="w-36 h-36 object-contain drop-shadow-2xl opacity-0 transition-all duration-500">
                </div>
                <!-- 我方 B 位 (双打时左侧并肩靠右) -->
                <div id="p1b-wrapper" class="hidden absolute bottom-8 left-48 flex flex-col items-center z-20">
                    <img id="p1b-img" alt="宝可梦" src="" class="w-32 h-32 object-contain drop-shadow-2xl opacity-0 transition-all duration-500">
                </div>
            </div>

            <div id="battle-feedback" aria-hidden="true"></div>
            <!-- 操作菜单层 -->
            <div id="menu-layer" class="absolute bottom-0 right-0 p-1 z-40 flex flex-col items-end gap-1.5 hidden">
                
                <!-- 双打行动提示条 -->
                <div id="slot-turn-indicator" class="hidden bg-gray-900/90 text-yellow-300 text-[10px] font-bold px-2 py-0.5 rounded border border-yellow-500/50 mr-2 shadow">
                    👉 为 [1号位] 下达指令
                </div>

                <div class="battle-key-hint">键盘 1–4 选招或目标 · Esc 返回</div><div id="decision-summary"></div><button id="undo-choice" class="hidden" onclick="window.undoBattleChoice()">↶ 修改上一只行动</button>
                <!-- 主菜单 -->
                <div id="main-menu" class="grid grid-cols-2 gap-1.5 w-48 mb-2 mr-2">
                    <button onclick="window.uiShowMoves()" class="bg-red-500 hover:bg-red-400 text-white py-1.5 rounded font-bold text-[10px] shadow border-b-4 border-red-700 active:border-b-0 active:translate-y-1 transition-all">⚔️ 战斗</button>
                    <button onclick="window.uiShowGimmicks()" class="bg-purple-600 hover:bg-purple-500 text-white py-1.5 rounded font-bold text-[10px] shadow border-b-4 border-purple-800 active:border-b-0 active:translate-y-1 transition-all">✨ 机制</button>
                    <button onclick="window.uiShowSwitch()" class="bg-blue-500 hover:bg-blue-400 text-white py-1.5 rounded font-bold text-[10px] shadow border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition-all">🦄 精灵</button>
                    <button class="col-span-2 bg-gray-600 text-gray-200 py-1.5 rounded font-bold text-[10px] opacity-50 cursor-not-allowed">🏃 逃跑</button>
                </div>

                <!-- 技能菜单 -->
                <div id="battle-moves" class="hidden w-72 bg-gray-900/95 p-1.5 rounded-lg backdrop-blur-sm border border-gray-600 mb-2 mr-2">
                    <div class="flex justify-between items-center mb-1 px-1">
                        <span id="moves-header-title" class="text-[9px] text-gray-300">选择招式:</span>
                        <button class="text-[9px] text-red-400 hover:text-red-300" onclick="window.uiBackToMenu()">✕</button>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5">
                        <button id="move-btn-1" onclick="window.sendMove(1)" class="move-slot w-full"></button>
                        <button id="move-btn-2" onclick="window.sendMove(2)" class="move-slot w-full"></button>
                        <button id="move-btn-3" onclick="window.sendMove(3)" class="move-slot w-full"></button>
                        <button id="move-btn-4" onclick="window.sendMove(4)" class="move-slot w-full"></button>
                    </div>
                </div>

                <!-- 双打目标选择面板 (Target Selection) -->
                <div id="target-menu" class="hidden w-64 bg-gray-900/95 p-2 rounded-lg backdrop-blur-sm border border-yellow-500/80 mb-2 mr-2 shadow-2xl">
                    <div class="flex justify-between items-center mb-1.5 px-0.5 border-b border-gray-700 pb-1">
                        <span class="text-[10px] text-yellow-300 font-bold">🎯 选择技能目标:</span>
                        <button class="text-[10px] text-red-400 hover:text-red-300" onclick="window.uiCancelTarget()">✕</button>
                    </div>
                    <div class="flex flex-col gap-1" id="target-buttons-list"></div>
                </div>

                <!-- 机制特殊菜单 (含太晶化、Mega、极巨化) -->
                <div id="gimmick-menu" class="hidden w-44 bg-purple-900/95 p-2 rounded-lg backdrop-blur-sm border border-purple-600 mb-2 mr-2 shadow-xl">
                    <div class="flex justify-between items-center mb-1.5 border-b border-purple-500/40 pb-1">
                        <span class="text-[10px] text-purple-200 font-bold">特殊战力系统:</span>
                        <button class="text-[10px] text-red-400 hover:text-red-300" onclick="window.uiBackToMenu()">✕</button>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="flex items-center space-x-2 cursor-pointer bg-black/40 p-1.5 rounded hover:bg-black/60 transition">
                            <input type="checkbox" id="check-tera" class="form-checkbox text-cyan-400 rounded h-3.5 w-3.5">
                            <span class="gimmick-text"><span class="gimmick-name" id="gimmick-name-tera">💎 太晶化</span><small class="gimmick-reason" id="gimmick-reason-tera"></small></span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer bg-black/40 p-1.5 rounded hover:bg-black/60 transition">
                            <input type="checkbox" id="check-mega" class="form-checkbox text-pink-500 rounded h-3.5 w-3.5">
                            <span class="gimmick-text"><span class="gimmick-name" id="gimmick-name-mega">🧬 MEGA 进化</span><small class="gimmick-reason" id="gimmick-reason-mega"></small></span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer bg-black/40 p-1.5 rounded hover:bg-black/60 transition">
                            <input type="checkbox" id="check-dynamax" class="form-checkbox text-red-500 rounded h-3.5 w-3.5">
                            <span class="gimmick-text"><span class="gimmick-name" id="gimmick-name-dynamax">🔴 极巨化</span><small class="gimmick-reason" id="gimmick-reason-dynamax"></small></span>
                        </label>
                    </div>
                </div>

                <!-- 换人菜单 -->
                <div id="switch-menu" class="hidden w-48 bg-blue-900/95 p-2 rounded-lg backdrop-blur-sm border border-blue-600 mb-2 mr-2">
                    <div class="flex justify-between items-center mb-1">
                        <span id="switch-menu-title" class="text-[10px] text-gray-300">选择交换:</span>
                        <button id="btn-cancel-switch" class="text-[10px] text-red-400 hover:text-red-300" onclick="window.uiBackToMenu()">✕</button>
                    </div>
                    <div class="flex flex-col gap-1" id="pokemon-list"></div>
                </div>
            </div>
        </div>

        <!-- 右 Joy-Con -->
        <div class="w-24 plastic-texture-r rounded-r-[40px] shadow-inner border-l border-black/20 h-[360px] p-4 flex flex-col items-center">
            <div class="text-[9px] font-bold text-white mb-2 opacity-80 border-b border-white/30 w-full text-center pb-1">敌方场地</div>
            <div id="p2-side-conditions" class="text-[8px] text-white text-center flex flex-col gap-1"></div>
        </div>
    </div>

    <details id="round-summary"><summary id="round-summary-title">回合摘要（本回合结束后可查看）</summary><ul id="round-notes"></ul></details>
    <!-- 纸质对战日志打印机 -->
    <div id="log-printer" class="w-[560px] relative flex flex-col items-center -mt-4">
        <div class="w-[520px] h-4 bg-black/40 blur-sm rounded-full"></div>
        <div class="paper-pattern w-full h-[240px] rounded-b-xl shadow-lg border border-gray-300 relative overflow-hidden pb-4">
            <div class="absolute top-0 left-0 right-0 h-3 bg-white z-10" style="background: linear-gradient(135deg, transparent 75%, rgba(0,0,0,0.05) 75%) 0 0, linear-gradient(-135deg, transparent 75%, rgba(0,0,0,0.05) 75%) 0 0; background-size: 10px 10px;"></div>
            <div id="log-container" class="allow-select mt-6 px-6 h-full custom-scrollbar flex flex-col gap-2 text-xs text-gray-700 font-mono">
                <div class="pl-2 border-l-2 border-gray-300 text-gray-400">请配置队伍并开始战斗...</div>
            </div>
        </div>
    </div>
</div>
<script src="dist/bundle.js"></script>
</body>
</html>
